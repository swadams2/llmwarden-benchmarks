[project]
name = "llmwarden-benchmarks"
version = "0.1.0"
description = "Versioned evasion-case corpus and scorer comparing LLMWarden against raw Prompt Guard 2"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    # Pinned to a commit SHA, not a tag, per LLMWarden's own README guidance on
    # pinning anything security-sensitive -- this is exactly that context.
    "llmwarden[classifier] @ git+https://github.com/swadams2/llmwarden.git@1353791b3398ef7125aed573cfa36f82a857cdf8",  # v0.8.3
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "basedpyright"]
# Corpus builder only (benchmarks/build_external_slice.py): 4 of the 6 external
# datasets are Parquet-only, and every dataset is downloaded with huggingface_hub
# at a pinned revision. Exact-pinned; install from
# requirements-build-corpus.lock.txt with --require-hashes. Scoring runners never
# import pyarrow.
build-corpus = ["pyarrow==25.0.1", "huggingface_hub==1.30.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["benchmarks"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: runs a real model in its own venv; skips with a reason when prerequisites are absent",
]
