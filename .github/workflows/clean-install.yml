# Clean-environment test on every push, the way a public user can run this repo. Report-only.
# Source mode: the package itself needs private LLMWarden, so (like the README's plain-venv
# path) only pytest is installed and the tests run in the tree; tests that need LLMWarden or
# a third-party venv skip with a reason.
# Logic lives in swadams2/ci-workflows; this file only says how to install this repo.
name: clean-install

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clean-install-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clean-install:
    uses: swadams2/ci-workflows/.github/workflows/clean-install.yml@8ee0f0b7980737410134671932a7f0b803166b99 # main 2026-10-09
    with:
      mode: source
      test-requirements: pytest
